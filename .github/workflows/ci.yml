name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: bash setup.sh
      - if: runner.os == 'Windows'
        run: npm ci
      - run: npm run check
      - run: npm test
      - if: runner.os == 'Windows'
        run: npm run browsers
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-${{ matrix.os }}
          path: test-results/
